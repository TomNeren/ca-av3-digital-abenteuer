  /* Bericht als CSV-Datei speichern (öffnet sich in Excel; robuster als Screenshot) */
  exportReport(){
    const lines=[];
    lines.push("Digital-Abenteuer – Bericht");
    lines.push("Name;"+(this.state.name||""));
    lines.push("Datum;"+(this.state.startedAt||""));
    lines.push("Punkte;"+this.state.points);
    lines.push("Rang;"+this.rank());
    lines.push("Abzeichen;"+this.state.badges.length+"/"+BADGES.length);
    lines.push("");
    lines.push("Welt;Aufgabe;Ergebnis;Punkte");
    WORLDS.forEach(w=>w.acts.forEach(a=>{
      const s=this.state.acts[a.id];
      const res=!s||!s.done?"offen":s.correct?"richtig":"teils/falsch";
      const q=(a.q||"").replace(/[\r\n;]+/g," ").slice(0,80);
      lines.push(w.bpe+";"+q+";"+res+";"+(s?s.points:0));
    }));
    const csv="﻿"+lines.join("\r\n");   // BOM -> Umlaute in Excel korrekt
    try{
      const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
      const url=URL.createObjectURL(blob);
      const el=document.createElement("a");
      el.href=url;
      el.download="Digital-Abenteuer_"+((this.state.name||"Bericht").replace(/[^a-z0-9]+/gi,"_"))+".csv";
      document.body.appendChild(el);el.click();
      setTimeout(()=>{URL.revokeObjectURL(url);el.remove();},600);
      this.toast("📄 Bericht als Datei gespeichert.");
    }catch(e){this.toast("Speichern hier nicht möglich – bitte Screenshot nutzen.");}
  },

  /* ---- Bestenliste (offline, ohne Server) ---- */
  BOARD_KEY:"ca_av3_board_v1",
  myCode(){
    const n=(this.state.name||"?").replace(/[|\n\r]/g," ").trim();
    return "CA|"+n+"|"+this.state.points+"|"+this.rank();
  },
  copyCode(){
    const code=this.myCode();
    const done=()=>this.toast("📋 Code kopiert! Gib ihn deiner Lehrkraft.");
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,()=>this._copyFallback(code,done));}
      else this._copyFallback(code,done);
    }catch(e){this._copyFallback(code,done);}
  },
  _copyFallback(code,done){
    const f=document.getElementById("myCodeField");
    if(f){f.removeAttribute("readonly");f.select();try{document.execCommand("copy");}catch(e){}f.setAttribute("readonly","");done();}
    else this.toast("Bitte den Code markieren und kopieren.");
  },
  parseCode(line){
    line=(line||"").trim();if(!line)return null;
    if(/^CA\|/i.test(line)){
      const p=line.split("|");const name=(p[1]||"").trim();const pts=parseInt(p[2],10);
      if(name&&!isNaN(pts))return {name:name,points:pts,rank:(p[3]||"").trim()};
      return null;
    }
    // toleranter Fallback: „Name … 120“ / „Name;120“ / „Name 120 Pkt“
    const m=line.match(/^(.*?)[\s;,|]+(\d{1,5})\s*(?:pkt|punkte)?\.?$/i);
    if(m&&m[1].replace(/[\s;,|]+$/,"").trim())
      return {name:m[1].replace(/[\s;,|]+$/,"").trim(),points:parseInt(m[2],10),rank:""};
    return null;
  },
  renderLeaderboard(){
    const app=document.getElementById("app");
    let raw="";try{raw=localStorage.getItem(this.BOARD_KEY)||"";}catch(e){}
    app.innerHTML=`
      <div class="hero" style="padding-bottom:0"><h1>🏅 Bestenliste</h1>
        <p class="muted">Für die Lehrkraft: Sammle die Ergebnis-Codes der SuS (vorlesen, Chat, Netzlaufwerk-Textdatei, USB) und füge sie hier ein.</p></div>
      <div class="card">
        <h3>Codes einfügen</h3>
        <p class="muted" style="font-size:.88rem;margin-top:-4px">Einen Code pro Zeile. Es genügen auch Zeilen wie „Max M. 120“. Alles bleibt nur auf diesem PC.</p>
        <textarea id="lbIn" style="min-height:120px" placeholder="CA|Max M.|120|Profi&#10;CA|Lena K.|180|Experte&#10;Tom R. 90">${this.esc(raw)}</textarea>
        <div class="navrow">
          <button class="btn" onclick="CA.buildBoard()">🏆 Rangliste erstellen</button>
          <label class="btn ghost" style="cursor:pointer">📂 Datei laden<input type="file" accept=".txt,.csv" style="display:none" onchange="CA.loadBoardFile(event)"></label>
          <button class="btn ghost" onclick="CA.clearBoard()">🗑️ Liste leeren</button>
        </div>
      </div>
      <div id="lbOut"></div>
      <div class="card center"><button class="btn" onclick="CA.go('map')">🗺️ Zurück zur Weltkarte</button></div>`;
    if(raw.trim())this.buildBoard();
  },
  loadBoardFile(ev){
    const file=ev.target&&ev.target.files&&ev.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{const ta=document.getElementById("lbIn");
      if(ta){ta.value=(ta.value.trim()?ta.value.trim()+"\n":"")+String(r.result);}this.buildBoard();};
    r.readAsText(file);
  },
  clearBoard(){
    const ta=document.getElementById("lbIn");if(ta)ta.value="";
    try{localStorage.removeItem(this.BOARD_KEY);}catch(e){}
    const out=document.getElementById("lbOut");if(out)out.innerHTML="";
    this.toast("Liste geleert.");
  },
  buildBoard(){
    const ta=document.getElementById("lbIn");const out=document.getElementById("lbOut");if(!ta||!out)return;
    const raw=ta.value;
    try{localStorage.setItem(this.BOARD_KEY,raw);}catch(e){}
    const byName={};
    raw.split(/\r?\n/).forEach(line=>{
      const e=this.parseCode(line);if(!e)return;
      const k=e.name.toLowerCase();
      if(!byName[k]||e.points>byName[k].points)byName[k]=e;   // pro Name bestes Ergebnis
    });
    const list=Object.values(byName).sort((a,b)=>b.points-a.points);
    if(!list.length){out.innerHTML=`<div class="card center muted">Noch keine gültigen Codes erkannt. Füge oben Codes ein und klicke „Rangliste erstellen“.</div>`;return;}
    const medal=i=>i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+".";
    let rows="";
    list.forEach((e,i)=>{
      rows+=`<tr${i<3?' style="font-weight:800"':''}><td style="text-align:center">${medal(i)}</td>
        <td>${this.esc(e.name)}</td><td style="color:var(--gold)">${e.points} Pkt</td>
        <td class="muted">${this.esc(e.rank||"")}</td></tr>`;
    });
    out.innerHTML=`
      <div class="card">
        <h3>Rangliste · ${list.length} Teilnehmer</h3>
        <table class="rep"><tr><th style="width:52px">Platz</th><th>Name</th><th>Punkte</th><th>Rang</th></tr>${rows}</table>
        <p class="muted" style="font-size:.8rem;margin-top:8px">📸 Für den Beamer geeignet. Klicke „Rangliste erstellen“ erneut, wenn neue Codes dazukommen.</p>
      </div>`;
  },

  resetAll(){
    if(!confirm("Wirklich ALLE Punkte und den Fortschritt löschen? Das kann nicht rückgängig gemacht werden."))return;
    const name=this.state.name,settings=this.state.settings;
    this.state=this.fresh();this.state.name=name;this.state.started=true;
    this.state.settings=settings;this.state.startedAt=new Date().toLocaleString("de-DE");
    this.state.badges.push("start");
    this._retry={};this._rankIdx=0;
    this.save();this.toast("Alles zurückgesetzt.");this.go("map");
  },

  /* ---- toast ---- */
  toast(msg){
    const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
    clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove("show"),1900);
  },
  esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));},

  /* =====================================================
     ACTIVITY RENDERERS
     ===================================================== */
  buildActivity(a,num,color){
    const wrap=document.createElement("div");
    wrap.className="card act";
    wrap.dataset.aid=a.id;
    const stored=this.state.acts[a.id];
    const done=stored&&stored.done&&!this._retry[a.id];
    if(done)wrap.classList.add("done");
    const typeLabel={mc:"Quiz",multi:"Mehrfachauswahl",tfset:"Wahr / Falsch",match:"Zuordnen",
      order:"Reihenfolge",buckets:"Sortieren",cloze:"Lückentext",short:"Kurzantwort",
      memory:"Memory-Spiel",sim:"Entscheidung",fakespot:"Fake-Detektiv",password:"Passwort-Spiel",
      livecell:"Excel-Zelle",inbox:"Postfach",formfill:"Formular"}[a.type]||"Aufgabe";
    const maxP=this.actMax(a);
    wrap.innerHTML=`
      <div class="a-type">${a.boss?"⚡ ":""}${num}. ${typeLabel} · ${maxP} Punkte ${a.boss?'<span class="pill tag-c">Bonus</span>':""}</div>
      <div class="q">${a.q}</div>
      <div class="a-body"></div>
      <div class="fb"></div>
      <div class="hintbox"></div>
      <div class="a-foot"></div>`;
    const body=wrap.querySelector(".a-body");
    const fb=wrap.querySelector(".fb");
    const foot=wrap.querySelector(".a-foot");
    const hintbox=wrap.querySelector(".hintbox");

    // hint button
    if(a.hint){
      const hb=document.createElement("button");hb.className="hintbtn";hb.textContent="💡 Hilfekarte (−5)";
      const alreadyHint=this.state.acts[a.id]&&this.state.acts[a.id].hint;
      if(alreadyHint||done){hintbox.textContent="💡 "+a.hint;hintbox.classList.add("show");hb.disabled=true;}
      hb.onclick=()=>{this.spendHint(a,5);hintbox.textContent="💡 "+a.hint;hintbox.classList.add("show");hb.disabled=true;};
      foot.appendChild(hb);
    }

    const showFB=(good,txt)=>{fb.className="fb show "+(good?"good":"bad");fb.innerHTML=txt;};

    // dispatch
    const R=this["r_"+a.type];
    R.call(this,a,body,foot,showFB,done);

    // 🔊 Vorlese-Knopf (immer verfügbar, unabhängig vom globalen Schalter)
    const spk=document.createElement("button");spk.className="spk";spk.type="button";
    spk.textContent="🔊";spk.title="Aufgabe vorlesen";
    spk.onclick=()=>this.speak(this.readText(a));
    foot.appendChild(spk);

    // 🔁 Nochmal-üben-Knopf: nur wenn erledigt, noch nicht perfekt und noch nicht wiederholt
    if(done&&stored&&!stored.correct&&!stored.retried&&a.type!=="memory"){
      const rt=document.createElement("button");rt.className="retrybtn";rt.type="button";
      rt.textContent="🔁 Nochmal versuchen";
      rt.onclick=()=>this.startRetry(a);
      foot.appendChild(rt);
    }
    return wrap;
  },
  kwMatch(hay,kw){
    // Mehrwort-Stichwörter direkt suchen; Einzelwörter mit linker Wortgrenze,
    // damit z. B. "finden" nicht innerhalb von "erfinden" fälschlich trifft.
    if(kw.indexOf(" ")>=0)return hay.indexOf(kw)>=0;
    const esc=kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    try{return new RegExp("(^|[^a-zäöüß0-9])"+esc,"i").test(hay);}
    catch(e){return hay.indexOf(kw)>=0;}
  },
  readText(a){
    let t=(a.q||"")+". ";
    if(a.scene)t+=a.scene+". ";
    if(a.options)t+=a.options.join(". ");
    if(a.statements)t+=a.statements.map(s=>s.st).join(". ");
    if(a.choices)t+=a.choices.map(c=>c.text).join(". ");
    return t;
  },

  lockNote(a){
    const s=this.state.acts[a.id];
    return `<span class="a-pts">Erledigt: +${s?s.points:0} Pkt</span>`;
  },

  /* MULTIPLE CHOICE */
  r_mc(a,body,foot,showFB,done){
    let chosen=-1;
    a.options.forEach((o,i)=>{
      const b=document.createElement("button");b.className="opt";b.textContent=o;
      b.onclick=()=>{if(done)return;
        if(chosen===i){b.classList.remove("sel");chosen=-1;return;} // 2. Klick = Auswahl aufheben
        [...body.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel");chosen=i;};
      body.appendChild(b);
    });
    if(done){this.mcReveal(a,body);foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,(this.state.acts[a.id].correct?"✅ ":"")+a.explain);return;}
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Prüfen";
    chk.onclick=()=>{
      if(chosen<0){this.toast("Bitte zuerst eine Antwort wählen.");return;}
      const correct=chosen===a.answer;
      this.mcReveal(a,body,chosen);
      [...body.children].forEach(c=>c.classList.add("disabled"));
      const pts=this.scorePts(a,correct);
      let fbTxt;
      if(correct){fbTxt="✅ Richtig! "+a.explain;}
      else{
        const w=(a.why&&a.why[chosen])?this.esc(a.why[chosen])+" ":"";
        fbTxt="❌ Nicht ganz. "+w+a.explain;
      }
      showFB(correct,fbTxt);
      chk.remove();this.complete(a,pts,correct);
    };
    foot.appendChild(chk);
  },
  mcReveal(a,body,chosen){
    [...body.children].forEach((c,i)=>{
      c.classList.add("disabled");
      if(i===a.answer)c.classList.add("correct");
      if(chosen!==undefined&&i===chosen&&chosen!==a.answer)c.classList.add("wrong");
    });
  },

  /* TRUE/FALSE SET */
  r_tfset(a,body,foot,showFB,done){
    const picks={};
    a.statements.forEach((s,i)=>{
      const row=document.createElement("div");row.className="tf-row";
      row.innerHTML=`<span class="st">${s.st}</span>`;
      const bt=document.createElement("button");bt.className="tf-btn";bt.textContent="Wahr";
      const bf=document.createElement("button");bf.className="tf-btn";bf.textContent="Falsch";
      bt.onclick=()=>{if(done)return;picks[i]=true;bt.classList.add("sel");bf.classList.remove("sel");};
      bf.onclick=()=>{if(done)return;picks[i]=false;bf.classList.add("sel");bt.classList.remove("sel");};
      row.appendChild(bt);row.appendChild(bf);
      row._bt=bt;row._bf=bf;body.appendChild(row);
    });
    const reveal=()=>{
      [...body.children].forEach((row,i)=>{
        const s=a.statements[i];const good=s.correct;
        (good?row._bt:row._bf).classList.add("correct");
        row._bt.disabled=row._bf.disabled=true;
      });
    };
    if(done){reveal();foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(true,a.explain);return;}
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Prüfen";
    chk.onclick=()=>{
      if(Object.keys(picks).length<a.statements.length){this.toast("Bitte alle Aussagen bewerten.");return;}
      let right=0;
      [...body.children].forEach((row,i)=>{
        const s=a.statements[i];const ok=picks[i]===s.correct;
        if(ok)right++;
        const selBtn=picks[i]?row._bt:row._bf;
        selBtn.classList.add(ok?"correct":"wrong");
        (s.correct?row._bt:row._bf).classList.add("correct");
        row._bt.disabled=row._bf.disabled=true;
      });
      const pts=this.hintAdjust(a,right*5);
      const allRight=right===a.statements.length;
      showFB(allRight,`${right} von ${a.statements.length} richtig. ${a.explain}`);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* MATCH (click to connect) */
  r_match(a,body,foot,showFB,done){
    const left=a.pairs.map((p,i)=>({t:p.l,i}));
    const right=a.pairs.map((p,i)=>({t:p.r,i}));
    this.shuffle(right);
    const grid=document.createElement("div");grid.className="match-grid";
    const lc=document.createElement("div");lc.className="m-col";
    const rc=document.createElement("div");rc.className="m-col";
    grid.appendChild(lc);grid.appendChild(rc);body.appendChild(grid);
    let pickedL=null;const links={};let count=0;const labels="ABCDEFGHIJKLMNOP";
    const lEls={},rEls={};
    left.forEach(o=>{const e=document.createElement("div");e.className="m-item";e.textContent=o.t;
      e.onclick=()=>{if(done||links[o.i]!==undefined)return;
        Object.values(lEls).forEach(x=>x.classList.remove("picked"));
        pickedL=o.i;e.classList.add("picked");};
      lEls[o.i]=e;lc.appendChild(e);});
    right.forEach(o=>{const e=document.createElement("div");e.className="m-item";e.textContent=o.t;
      e.onclick=()=>{if(done||pickedL===null||e.classList.contains("linked"))return;
        links[pickedL]=o.i;
        const lab=labels[count++];
        lEls[pickedL].classList.remove("picked");lEls[pickedL].classList.add("linked");
        lEls[pickedL].innerHTML=left.find(x=>x.i===pickedL).t+`<span class="lbl">${lab}</span>`;
        e.classList.add("linked");e.innerHTML=o.t+`<span class="lbl">${lab}</span>`;
        pickedL=null;};
      rEls[o.i]=e;rc.appendChild(e);});

    if(done){ // show solution
      a.pairs.forEach((p,i)=>{lEls[i]&&lEls[i].classList.add("linked");});
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,a.explain);
      body.innerHTML="";const g2=document.createElement("div");g2.className="match-grid";
      const l2=document.createElement("div");l2.className="m-col";const r2=document.createElement("div");r2.className="m-col";
      a.pairs.forEach(p=>{const e=document.createElement("div");e.className="m-item linked";e.textContent=p.l;l2.appendChild(e);
        const f=document.createElement("div");f.className="m-item linked";f.textContent=p.r;r2.appendChild(f);});
      g2.appendChild(l2);g2.appendChild(r2);body.appendChild(g2);
      return;
    }
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Prüfen";
    chk.onclick=()=>{
      if(Object.keys(links).length<a.pairs.length){this.toast("Bitte alle Paare verbinden.");return;}
      let right=0;
      Object.keys(links).forEach(li=>{if(parseInt(li)===links[li])right++;});
      const allRight=right===a.pairs.length;
      // mark
      Object.keys(links).forEach(li=>{const ok=parseInt(li)===links[li];
        if(ok){lEls[li].classList.add("linked");rEls[links[li]].classList.add("linked");}
        else{lEls[li].classList.add("badlink");rEls[links[li]].classList.add("badlink");}});
      const pts=this.hintAdjust(a,Math.round(right/a.pairs.length*10));
      showFB(allRight,`${right} von ${a.pairs.length} richtig verbunden. ${a.explain}`);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* ORDER */
  r_order(a,body,foot,showFB,done){
    const correct=a.items.slice();
    let cur=correct.slice();
    if(!done){let g=0;do{this.shuffle(cur);}while(cur.join("|")===correct.join("|")&&++g<50);}
    const list=document.createElement("div");list.className="order-list";body.appendChild(list);
    const draw=()=>{
      list.innerHTML="";
      cur.forEach((it,i)=>{
        const row=document.createElement("div");row.className="o-item";
        row.innerHTML=`<div class="o-num">${i+1}</div><div style="flex:1">${it}</div>`;
        if(!done){
          const mv=document.createElement("div");mv.className="o-move";
          const up=document.createElement("button");up.textContent="▲";up.title="nach oben";
          up.onclick=()=>{if(i>0){[cur[i-1],cur[i]]=[cur[i],cur[i-1]];draw();}};
          const dn=document.createElement("button");dn.textContent="▼";dn.title="nach unten";
          dn.onclick=()=>{if(i<cur.length-1){[cur[i+1],cur[i]]=[cur[i],cur[i+1]];draw();}};
          mv.appendChild(up);mv.appendChild(dn);row.appendChild(mv);
        }
        list.appendChild(row);
      });
    };
    if(done){cur=correct.slice();draw();[...list.children].forEach(r=>r.classList.add("correct"));
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));showFB(this.state.acts[a.id].correct,a.explain);return;}
    draw();
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Prüfen";
    chk.onclick=()=>{
      let right=0;cur.forEach((it,i)=>{if(it===correct[i])right++;});
      const allRight=right===correct.length;
      [...list.children].forEach((r,i)=>r.classList.add(cur[i]===correct[i]?"correct":"wrong"));
      const pts=this.hintAdjust(a,allRight?10:Math.round(right/correct.length*10));
      showFB(allRight,(allRight?"✅ Perfekte Reihenfolge! ":`${right} von ${correct.length} an richtiger Stelle. `)+a.explain);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* BUCKETS (click to place, + drag) */
  r_buckets(a,body,foot,showFB,done){
    const itemsWrap=document.createElement("div");itemsWrap.className="bucket-items";
    const buckets=document.createElement("div");buckets.className="buckets";
    body.appendChild(itemsWrap);body.appendChild(buckets);
    const placed={}; // item->bucket
    let picked=null;
    const bucketEls={};
    const chipEls={};   // item->chip (statt CSS.escape-Query -> robust auf alten Browsern)
    a.buckets.forEach(bn=>{
      const bx=document.createElement("div");bx.className="bucket";
      bx.innerHTML=`<h4>${bn}</h4><div class="drop"></div>`;
      bx.addEventListener("dragover",e=>{e.preventDefault();bx.classList.add("over");});
      bx.addEventListener("dragleave",()=>bx.classList.remove("over"));
      bx.addEventListener("drop",e=>{e.preventDefault();bx.classList.remove("over");
        const t=e.dataTransfer.getData("text");if(t)place(t,bn);});
      bx.onclick=()=>{if(picked!==null)place(picked,bn);};
      bucketEls[bn]=bx;buckets.appendChild(bx);
    });
    const items=a.items.map(x=>x.text);this.shuffle(items);
    const itemEls={};
    items.forEach(txt=>{
      const it=document.createElement("div");it.className="b-item";it.textContent=txt;it.draggable=!done;
      it.addEventListener("dragstart",e=>e.dataTransfer.setData("text",txt));
      it.onclick=()=>{if(done||placed[txt])return;
        Object.values(itemEls).forEach(x=>x.classList.remove("picked"));
        picked=txt;it.classList.add("picked");};
      itemEls[txt]=it;itemsWrap.appendChild(it);
    });
    function place(txt,bn){
      placed[txt]=bn;picked=null;
      itemEls[txt].classList.remove("picked");itemEls[txt].classList.add("placed");
      const chip=document.createElement("span");chip.className="drop-chip";chip.textContent=txt;
      chip.onclick=()=>{if(done)return;delete placed[txt];delete chipEls[txt];chip.remove();itemEls[txt].classList.remove("placed");};
      chipEls[txt]=chip;
      bucketEls[bn].querySelector(".drop").appendChild(chip);
    }
    if(done){
      a.items.forEach(x=>place(x.text,x.bucket));
      buckets.querySelectorAll(".drop-chip").forEach(c=>c.classList.add("correct"));
      itemsWrap.style.display="none";
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,a.explain);return;
    }
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Prüfen";
    chk.onclick=()=>{
      if(Object.keys(placed).length<a.items.length){this.toast("Bitte alle Begriffe einsortieren.");return;}
      let right=0;
      a.items.forEach(x=>{
        const chip=chipEls[x.text];
        const ok=placed[x.text]===x.bucket;if(ok)right++;
        if(chip)chip.classList.add(ok?"correct":"wrong");
      });
      const allRight=right===a.items.length;
      [...itemsWrap.children,...buckets.querySelectorAll('.b-item')].forEach(()=>{});
      const pts=this.hintAdjust(a,Math.round(right/a.items.length*10));
      showFB(allRight,`${right} von ${a.items.length} richtig sortiert. ${a.explain}`);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* CLOZE */
  r_cloze(a,body,foot,showFB,done){
    const box=document.createElement("div");box.className="cloze";
    const parts=a.template.split(/(\{\d+\})/g);
    const selects=[];
    parts.forEach(p=>{
      const m=p.match(/^\{(\d+)\}$/);
      if(m){
        const bi=parseInt(m[1]);const b=a.blanks[bi];
        const sel=document.createElement("select");
        sel.innerHTML=`<option value="-1">— wählen —</option>`+
          b.options.map((o,i)=>`<option value="${i}">${o}</option>`).join("");
        if(done){sel.value=b.answer;sel.disabled=true;sel.classList.add("correct");}
        selects[bi]=sel;box.appendChild(sel);
      }else{box.appendChild(document.createTextNode(p));}
    });
    body.appendChild(box);
    if(done){foot.insertAdjacentHTML("beforeend",this.lockNote(a));showFB(this.state.acts[a.id].correct,a.explain);return;}
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Prüfen";
    chk.onclick=()=>{
      if(selects.some(s=>s.value==="-1")){this.toast("Bitte alle Lücken ausfüllen.");return;}
      let right=0;const wrongInfo=[];
      selects.forEach((s,i)=>{const ok=parseInt(s.value)===a.blanks[i].answer;if(ok)right++;
        s.disabled=true;s.classList.add(ok?"correct":"wrong");
        if(!ok){
          // Schülerwahl bleibt sichtbar (rot). Richtige Lösung als grünes disabled-Element daneben zeigen.
          const sol=document.createElement("span");
          sol.className="cloze-sol";
          sol.textContent="richtig: "+a.blanks[i].options[a.blanks[i].answer];
          if(s.parentNode)s.parentNode.insertBefore(sol,s.nextSibling);
          wrongInfo.push(a.blanks[i].options[a.blanks[i].answer]);
        }});
      const allRight=right===a.blanks.length;
      const pts=this.hintAdjust(a,Math.round(right/a.blanks.length*10));
      const solNote=wrongInfo.length?` Richtig wäre: „${wrongInfo.join("“, „")}“.`:"";
      showFB(allRight,`${right} von ${a.blanks.length} Lücken richtig.${solNote} ${a.explain}`);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* SHORT ANSWER */
  r_short(a,body,foot,showFB,done){
    const ta=document.createElement("textarea");ta.placeholder="Schreibe deine Antwort hier …";
    if(done){ta.value=(this.state.acts[a.id].answerText)||"";ta.disabled=true;}
    body.appendChild(ta);
    if(done){foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,`<b>Beispiel-Lösung:</b> ${a.sample}<br>${a.explain}`);return;}
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Antwort prüfen";
    chk.onclick=()=>{
      const val=ta.value.trim();
      if(val.length<3){this.toast("Bitte schreibe zuerst eine Antwort.");return;}
      let ok;
      if(a.checkId&&this.CHECKS[a.checkId]){
        ok=this.CHECKS[a.checkId](val);
      }else{
        const low=val.toLowerCase();
        const need=a.minKw||1;
        let hits=0;(a.keywords||[]).forEach(k=>{if(this.kwMatch(low,k.toLowerCase()))hits++;});
        ok=hits>=need;
      }
      const pts=this.hintAdjust(a,ok?(a.boss?20:10):5); // Kurzantwort: Teilpunkte fürs Versuchen
      ta.disabled=true;
      this.state.acts[a.id]=this.state.acts[a.id]||{};
      // store text before complete
      const prevHint=(this.state.acts[a.id]||{}).hint;
      showFB(ok, (ok?"✅ Gut! Wichtige Stichwörter erkannt. ":"Danke für deinen Versuch. ")+
        `<br><b>Beispiel-Lösung:</b> ${a.sample}<br>${a.explain}`);
      chk.remove();
      this.complete(a,pts,ok);
      this.state.acts[a.id].answerText=val;this.state.acts[a.id].hint=prevHint;this.save();
    };
    foot.appendChild(chk);
  },

  /* MEMORY */
  r_memory(a,body,foot,showFB,done){
    const grid=document.createElement("div");grid.className="mem-grid";body.appendChild(grid);
    if(done){body.innerHTML=`<p class="muted">✔️ Memory gelöst.</p>`;
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));showFB(true,a.explain);return;}
    let cards=[];
    a.pairs.forEach((p,i)=>{cards.push({txt:p.a,pair:i});cards.push({txt:p.b,pair:i});});
    this.shuffle(cards);
    let first=null,lock=false,found=0,tries=0;
    cards.forEach(c=>{
      const el=document.createElement("div");el.className="mem-card";
      el.innerHTML=`<span class="front">❓</span>`;
      el.onclick=()=>{
        if(lock||el.classList.contains("matched")||el===first)return;
        el.classList.add("flip");el.innerHTML=c.txt;
        if(!first){first=el;first._c=c;return;}
        tries++;
        if(first._c.pair===c.pair){
          el.classList.add("matched");first.classList.add("matched");
          el.classList.remove("flip");first.classList.remove("flip");
          first=null;found++;
          if(found===a.pairs.length)finish();
        }else{
          lock=true;const f=first;
          setTimeout(()=>{el.classList.remove("flip");f.classList.remove("flip");
            el.innerHTML=`<span class="front">❓</span>`;f.innerHTML=`<span class="front">❓</span>`;
            first=null;lock=false;},750);
        }
      };
      grid.appendChild(el);
    });
    const finish=()=>{
      const pts=this.hintAdjust(a,10);
      const lob=tries<=a.pairs.length?"Perfekt, ohne Fehler! ":"";
      showFB(true,`✅ ${lob}Alle Paare gefunden mit ${tries} Versuchen! ${a.explain}`);
      this.complete(a,pts,true);
    };
    foot.insertAdjacentHTML("beforeend",`<span class="muted" style="font-size:.85rem">Finde alle Paare.</span>`);
  },

  /* SIM */
  r_sim(a,body,foot,showFB,done){
    body.innerHTML=`<div class="sim-scene">${a.scene}</div>`;
    if(done){
      const s=this.state.acts[a.id];
      body.innerHTML+=`<p class="muted">Deine Entscheidung wurde gewertet.</p>`;
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(s.correct,a.explain);return;
    }
    a.choices.forEach(ch=>{
      const b=document.createElement("button");b.className="sim-choice";b.textContent=ch.text;
      b.onclick=()=>{
        if(b._used)return;b._used=true;   // Doppelklick-Schutz
        [...body.querySelectorAll(".sim-choice")].forEach(x=>x.style.display="none");
        const best=Math.max(...a.choices.map(c=>c.points))||1;
        const correct=ch.points===best;
        // Punkte auf actMax skalieren -> Sterne/HUD bleiben konsistent
        const pts=this.hintAdjust(a,Math.round(ch.points/best*this.actMax(a)));
        showFB(correct,`${ch.feedback}<br><br>${a.explain}`);
        this.complete(a,pts,correct);
      };
      body.appendChild(b);
    });
  },

  /* FAKESPOT */
  r_fakespot(a,body,foot,showFB,done){
    const web=document.createElement("div");web.className="fake-web";
    web.innerHTML=`<div class="fake-bar">🔒❓ ${a.url}</div>`;
    const bodyEl=document.createElement("div");bodyEl.className="fake-body";web.appendChild(bodyEl);
    const picks=new Set();
    a.els.forEach((el,i)=>{
      const d=document.createElement("div");d.className="fake-el";d.textContent=el.text;
      d.onclick=()=>{if(done)return;
        if(picks.has(i)){picks.delete(i);d.classList.remove("picked");}
        else{picks.add(i);d.classList.add("picked");}};
      d._el=el;bodyEl.appendChild(d);
    });
    body.appendChild(web);
    if(done){
      [...bodyEl.children].forEach(d=>{if(d._el.warn)d.classList.add("hit");});
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));showFB(this.state.acts[a.id].correct,a.explain);return;}
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Warnzeichen prüfen";
    chk.onclick=()=>{
      let right=0;const totalWarn=a.els.filter(e=>e.warn).length;
      [...bodyEl.children].forEach((d,i)=>{
        const warn=d._el.warn,picked=picks.has(i);
        if(warn&&picked){d.classList.add("hit");right++;}
        else if(!warn&&picked){d.classList.add("miss");right--;}
        else if(warn&&!picked){d.classList.add("miss");}
      });
      right=Math.max(0,right);
      const allRight=right===totalWarn;
      const pts=this.hintAdjust(a,Math.round(right/totalWarn*10));
      showFB(allRight,`${right} von ${totalWarn} Warnzeichen gefunden. ${a.explain}`);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* PASSWORD */
  r_password(a,body,foot,showFB,done){
    if(done){body.innerHTML=`<p class="muted">✔️ Sicheres Passwort erstellt.</p>`;
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));showFB(true,a.explain);return;}
    body.innerHTML=`
      <input type="text" id="pwIn_${a.id}" placeholder="Tippe hier ein Passwort …" maxlength="40">
      <div class="pw-meter"><span id="pwBar_${a.id}"></span></div>
      <ul class="pw-checks" id="pwList_${a.id}">
        <li data-k="len">Mindestens 8 Zeichen lang</li>
        <li data-k="low">Enthält Kleinbuchstaben (a–z)</li>
        <li data-k="up">Enthält Großbuchstaben (A–Z)</li>
        <li data-k="num">Enthält eine Zahl (0–9)</li>
        <li data-k="sym">Enthält ein Sonderzeichen (! ? # …)</li>
      </ul>`;
    const inp=body.querySelector("input");
    const bar=body.querySelector(".pw-meter>span");
    const list=body.querySelector(".pw-checks");
    let solved=false;
    // Knopf zuerst anlegen, damit check() ihn sicher referenzieren kann
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Ich gebe auf – Lösung zeigen";
    const check=()=>{
      const v=inp.value;
      const c={len:v.length>=8,low:/[a-z]/.test(v),up:/[A-Z]/.test(v),num:/[0-9]/.test(v),
        sym:/[^A-Za-z0-9]/.test(v)};
      let score=0;list.querySelectorAll("li").forEach(li=>{const ok=c[li.dataset.k];
        li.classList.toggle("ok",ok);if(ok)score++;});
      const pct=score/5*100;bar.style.width=pct+"%";
      bar.style.background=pct<40?"var(--red)":pct<80?"var(--amber)":"var(--green)";
      if(score===5&&!solved){solved=true;
        inp.disabled=true;
        const pts=this.hintAdjust(a,10);
        showFB(true,"✅ Stark! Dieses Passwort erfüllt alle Regeln. "+a.explain);
        chk.remove();
        this.complete(a,pts,true);
      }
    };
    inp.addEventListener("input",check);
    chk.onclick=()=>{if(solved)return;
      inp.disabled=true;
      showFB(false,"Kein Problem – so sieht ein starkes Passwort aus: <b>Sonne+Regen2024!</b> "+a.explain);
      chk.remove();this.complete(a,0,false);   // Aufgeben: keine Punkte, aber „🔁 Nochmal“ bleibt möglich
    };
    foot.appendChild(chk);
  },

  /* LIVECELL – echte Mini-Excel-Zelle mit sicherem Formel-Parser (kein eval) */
  cellVal(cells,ref){
    // ref z.B. "B3" -> Zahl aus cells (case-insensitive), nicht vorhanden = 0
    const key=Object.keys(cells).find(k=>k.toUpperCase()===ref.toUpperCase());
    if(key===undefined)return 0;
    const n=parseFloat(String(cells[key]).replace(",","."));
    return isNaN(n)?0:n;
  },
  rangeVals(cells,range){
    // "B1:B3" -> Array der Werte; nur gleiche Spalte oder gleiche Zeile
    const m=range.match(/^([A-Za-z]+)(\d+):([A-Za-z]+)(\d+)$/);
    if(!m)return null;
    const c1=m[1].toUpperCase(),r1=parseInt(m[2]),c2=m[3].toUpperCase(),r2=parseInt(m[4]);
    const out=[];
    if(c1===c2){
      const lo=Math.min(r1,r2),hi=Math.max(r1,r2);
      for(let r=lo;r<=hi;r++)out.push(this.cellVal(cells,c1+r));
    }else if(r1===r2){
      // Spaltenbereich über eine Zeile (nur A/B hier, aber allgemein einfach)
      const a=c1.charCodeAt(0),b=c2.charCodeAt(0);
      const lo=Math.min(a,b),hi=Math.max(a,b);
      for(let c=lo;c<=hi;c++)out.push(this.cellVal(cells,String.fromCharCode(c)+r1));
    }else return null;
    return out;
  },
  evalFormula(cells,raw){
    // Sicherer Parser: gibt Zahl zurück oder null bei Fehler. KEIN eval/Function.
    let s=(raw||"").trim();
    if(s.charAt(0)!=="=")return null;      // führendes = Pflicht
    s=s.slice(1).replace(/\s+/g,"");
    if(s==="")return null;
    // Funktion? SUMME/MITTELWERT/MAX/MIN(...)
    const fm=s.match(/^(SUMME|MITTELWERT|MAX|MIN)\((.+)\)$/i);
    if(fm){
      const fn=fm[1].toUpperCase();const inside=fm[2];
      let vals=null;
      if(/^[A-Za-z]+\d+:[A-Za-z]+\d+$/.test(inside)){
        vals=this.rangeVals(cells,inside);
      }else{
        // Einzelargumente mit ; getrennt: Zellbezüge oder Zahlen
        const args=inside.split(";");
        vals=[];
        for(const arg of args){
          if(arg==="")return null;
          if(/^[A-Za-z]+\d+$/.test(arg)){vals.push(this.cellVal(cells,arg));}
          else if(/^-?\d+(\.\d+)?$/.test(arg)){vals.push(parseFloat(arg));}
          else return null;
        }
      }
      if(!vals||vals.length===0)return null;
      if(fn==="SUMME")return vals.reduce((x,y)=>x+y,0);
      if(fn==="MITTELWERT")return vals.reduce((x,y)=>x+y,0)/vals.length;
      if(fn==="MAX")return Math.max.apply(null,vals);
      if(fn==="MIN")return Math.min.apply(null,vals);
      return null;
    }
    // Einfache Rechnung: Zellbezüge / Zahlen, verbunden mit + - * /
    // Tokenize: nur erlaubte Zeichen zulassen
    if(!/^([A-Za-z]+\d+|-?\d+(\.\d+)?|[+\-*/])+$/.test(s))return null;
    const tokens=s.match(/([A-Za-z]+\d+|\d+(?:\.\d+)?|[+\-*/])/g);
    if(!tokens)return null;
    // In Zahlen + Operatoren umwandeln, dann links-nach-rechts mit Punkt-vor-Strich
    const nums=[],ops=[];
    let expectVal=true;
    for(const t of tokens){
      if(t==="+"||t==="-"||t==="*"||t==="/"){
        if(expectVal)return null;      // Operator an falscher Stelle
        ops.push(t);expectVal=true;
      }else{
        if(!expectVal)return null;      // zwei Werte hintereinander
        let n;
        if(/^[A-Za-z]+\d+$/.test(t))n=this.cellVal(cells,t);
        else n=parseFloat(t);
        if(isNaN(n))return null;
        nums.push(n);expectVal=false;
      }
    }
    if(expectVal)return null;           // endet mit Operator
    // Punkt vor Strich
    for(let i=0;i<ops.length;){
      if(ops[i]==="*"||ops[i]==="/"){
        const r=ops[i]==="*"?nums[i]*nums[i+1]:(nums[i+1]===0?null:nums[i]/nums[i+1]);
        if(r===null)return null;
        nums.splice(i,2,r);ops.splice(i,1);
      }else i++;
    }
    let res=nums[0];
    for(let i=0;i<ops.length;i++){
      if(ops[i]==="+")res+=nums[i+1];else res-=nums[i+1];
    }
    return (typeof res==="number"&&isFinite(res))?res:null;
  },
  liveGridHTML(g,fillTarget){
    // baut die Tabelle; wenn fillTarget=Zahl -> Zielzelle mit dem Wert, sonst "?"
    let html='<table class="xl-tab"><tr><th class="xl-corner"></th>';
    g.cols.forEach(c=>{html+=`<th>${c}</th>`;});
    html+='</tr>';
    const totalRows=g.rows+1;
    for(let r=1;r<=totalRows;r++){
      html+=`<tr><th class="xl-rownum">${r}</th>`;
      g.cols.forEach(c=>{
        const ref=c+r;
        let cls="",content="";
        if(ref===g.targetCell){
          cls=" xl-target";
          content=(fillTarget!==undefined&&fillTarget!==null)?this.esc(String(fillTarget)):'<span class="xl-q">?</span>';
        }else if(ref===g.targetLabelCell){
          content=this.esc(g.targetLabel||"");
        }else if(g.cells[ref]!==undefined){
          content=this.esc(String(g.cells[ref]));
        }
        html+=`<td class="xl-cell${cls}" data-ref="${ref}">${content}</td>`;
      });
      html+='</tr>';
    }
    html+='</table>';
    return html;
  },
  r_livecell(a,body,foot,showFB,done){
    const g=a.grid;
    if(done){
      body.innerHTML=this.liveGridHTML(g,g.targetValue);
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,a.explain);return;
    }
    const wrap=document.createElement("div");
    wrap.innerHTML=this.liveGridHTML(g,null)+
      `<div class="xl-input-row">
         <label class="xl-lbl">Formel für ${g.targetCell}:</label>
         <input type="text" class="xl-formula" placeholder="Formel hier eingeben, z.B. =SUMME(...)" maxlength="60">
       </div>
       <div class="xl-result muted">Ergebnis erscheint hier live in der gelben Zelle.</div>`;
    body.appendChild(wrap);
    const inp=wrap.querySelector(".xl-formula");
    const targetTd=wrap.querySelector('.xl-cell.xl-target');
    const resEl=wrap.querySelector(".xl-result");
    let solved=false;
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Ich gebe auf – Lösung zeigen";
    const live=()=>{
      if(solved)return;
      const v=inp.value;
      if(v.trim()===""){targetTd.innerHTML='<span class="xl-q">?</span>';resEl.textContent="";resEl.className="xl-result muted";return;}
      const r=this.evalFormula(g.cells,v);
      if(r===null){
        targetTd.innerHTML='<span class="xl-err">#FEHLER</span>';
        resEl.textContent="Diese Formel versteht Excel nicht. Beginne mit = .";resEl.className="xl-result bad";
        return;
      }
      // Zahl schön anzeigen (ganze Zahl ohne Komma)
      const shown=(Math.round(r*1000)/1000);
      targetTd.textContent=String(shown);
      resEl.className="xl-result";
      if(Math.abs(r-g.targetValue)<0.001){
        solved=true;
        this.beep("good");
        inp.disabled=true;
        resEl.textContent="Richtig!";
        showFB(true,"✅ Stark! Die Zelle rechnet: "+shown+". "+a.explain);
        chk.remove();
        this.complete(a,this.hintAdjust(a,this.actMax(a)),true);
      }else{
        resEl.textContent="Ergebnis: "+shown+" – noch nicht das Ziel.";
      }
    };
    inp.addEventListener("input",live);
    chk.onclick=()=>{if(solved)return;
      inp.value="=SUMME("+g.targetCell.charAt(0)+"1:"+g.targetCell.charAt(0)+g.rows+")";
      inp.disabled=true;
      targetTd.textContent=String(g.targetValue);
      showFB(false,"Kein Problem – so geht's: <b>"+this.esc(a.hint||"")+"</b> "+a.explain);
      chk.remove();this.complete(a,0,false);
    };
    foot.appendChild(chk);
  },

  /* INBOX – Postfach sortieren */
  r_inbox(a,body,foot,showFB,done){
    const acts={"behalten":"📂 Behalten","melden":"🚨 Melden","löschen":"🗑️ Löschen"};
    const order=["behalten","melden","löschen"];
    const chosen={};   // index -> action
    const rowEls=[];
    a.mails.forEach((m,i)=>{
      const row=document.createElement("div");row.className="mail-row";
      row.innerHTML=`
        <div class="mail-head"><span class="mail-from">${this.esc(m.from)}</span></div>
        <div class="mail-subj">${this.esc(m.subj)}</div>
        <div class="mail-prev">${this.esc(m.prev)}</div>
        <div class="mail-btns"></div>`;
      const btnWrap=row.querySelector(".mail-btns");
      const btns={};
      order.forEach(act=>{
        const b=document.createElement("button");b.className="mail-act";b.type="button";b.textContent=acts[act];
        b.dataset.act=act;
        b.onclick=()=>{if(done)return;
          chosen[i]=act;
          Object.values(btns).forEach(x=>x.classList.remove("sel"));
          b.classList.add("sel");};
        btns[act]=b;btnWrap.appendChild(b);
      });
      row._btns=btns;rowEls.push(row);body.appendChild(row);
    });
    const markRow=(i,correctAct,userAct)=>{
      const btns=rowEls[i]._btns;
      Object.values(btns).forEach(x=>{x.disabled=true;});
      btns[correctAct].classList.add("correct");
      if(userAct&&userAct!==correctAct)btns[userAct].classList.add("wrong");
    };
    if(done){
      a.mails.forEach((m,i)=>markRow(i,m.action,null));
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,a.explain);return;
    }
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Postfach prüfen";
    chk.onclick=()=>{
      if(Object.keys(chosen).length<a.mails.length){this.toast("Bitte bei jeder Mail entscheiden.");return;}
      let right=0;
      a.mails.forEach((m,i)=>{const ok=chosen[i]===m.action;if(ok)right++;markRow(i,m.action,chosen[i]);});
      const allRight=right===a.mails.length;
      const pts=this.hintAdjust(a,Math.round(right/a.mails.length*this.actMax(a)));
      showFB(allRight,`${right} von ${a.mails.length} richtig einsortiert. ${a.explain}`);
      chk.remove();this.complete(a,pts,allRight);
    };
    foot.appendChild(chk);
  },

  /* FORMFILL – Online-Formular ausfüllen */
  formValid(f,val){
    // val: string (text/select) oder {ok:bool} für Datei. Gibt {ok,msg} zurück.
    if(f.type==="file"){
      if(!val)return {ok:false,msg:"Bitte die PDF-Datei wählen (die andere ist zu groß)."};
      return val.ok?{ok:true,msg:""}:{ok:false,msg:"Bitte die PDF-Datei wählen (die andere ist zu groß)."};
    }
    if(f.type==="select"){
      if(!val||val==="0")return {ok:false,msg:"Bitte eine Stelle wählen."};
      return {ok:true,msg:""};
    }
    const v=(val||"").trim();
    if(f.required&&v===""){return {ok:false,msg:"Bitte ausfüllen."};}
    if(f.rule==="email"){return /.+@.+\..+/.test(v)?{ok:true,msg:""}:{ok:false,msg:"Die E-Mail braucht ein @ und einen Punkt."};}
    if(f.rule==="plz"){return /^\d{5}$/.test(v)?{ok:true,msg:""}:{ok:false,msg:"PLZ = 5 Ziffern."};}
    if(f.rule==="date"){return /^\d{2}\.\d{2}\.\d{4}$/.test(v)?{ok:true,msg:""}:{ok:false,msg:"Datum im Format TT.MM.JJJJ eingeben."};}
    return {ok:true,msg:""};
  },
  r_formfill(a,body,foot,showFB,done){
    if(done){
      body.innerHTML=`<p class="muted">✔️ Formular abgeschickt.</p>`;
      foot.insertAdjacentHTML("beforeend",this.lockNote(a));
      showFB(this.state.acts[a.id].correct,a.explain);return;
    }
    const form=document.createElement("div");form.className="ffform";
    const state={};   // key -> value (string) oder für file: {ok}
    a.fields.forEach(f=>{
      const fld=document.createElement("div");fld.className="ff-field";
      const lab=document.createElement("label");lab.className="ff-label";lab.textContent=f.label+(f.required?" *":"");
      fld.appendChild(lab);
      if(f.type==="text"){
        const inp=document.createElement("input");inp.type="text";inp.className="ff-input";
        inp.oninput=()=>{state[f.key]=inp.value;};
        fld._input=inp;fld.appendChild(inp);
      }else if(f.type==="select"){
        const sel=document.createElement("select");sel.className="ff-input";
        f.options.forEach((o,i)=>{const op=document.createElement("option");op.value=String(i);op.textContent=o;sel.appendChild(op);});
        sel.onchange=()=>{state[f.key]=sel.value;};
        fld._input=sel;fld.appendChild(sel);
      }else if(f.type==="file"){
        const box=document.createElement("div");box.className="ff-file";
        const btn=document.createElement("button");btn.type="button";btn.className="ff-filebtn";btn.textContent="📎 Datei wählen";
        const menu=document.createElement("div");menu.className="ff-filemenu hidden";
        const shown=document.createElement("div");shown.className="ff-fileshown muted";shown.textContent="Keine Datei gewählt";
        f.files.forEach(file=>{
          const fb=document.createElement("button");fb.type="button";fb.className="ff-fileopt";fb.textContent=file.name;
          fb.onclick=()=>{state[f.key]=file;shown.textContent="Gewählt: "+file.name;shown.className="ff-fileshown";menu.classList.add("hidden");};
          menu.appendChild(fb);
        });
        btn.onclick=()=>menu.classList.toggle("hidden");
        box.appendChild(btn);box.appendChild(menu);box.appendChild(shown);
        fld._box=box;fld.appendChild(box);
      }
      const err=document.createElement("div");err.className="ff-err";fld._err=err;fld.appendChild(err);
      fld._f=f;form.appendChild(fld);
    });
    body.appendChild(form);
    const chk=document.createElement("button");chk.className="checkbtn";chk.textContent="Absenden";
    chk.onclick=()=>{
      let right=0;
      [...form.children].forEach(fld=>{
        const f=fld._f;
        const val=(f.type==="file")?state[f.key]:(state[f.key]!==undefined?state[f.key]:(f.type==="select"?"0":""));
        const res=this.formValid(f,val);
        const inpEl=fld._input||fld._box;
        if(res.ok){right++;fld._err.textContent="";inpEl&&inpEl.classList&&inpEl.classList.remove("ff-bad");inpEl&&inpEl.classList&&inpEl.classList.add("ff-good");}
        else{fld._err.textContent=res.msg;inpEl&&inpEl.classList&&inpEl.classList.add("ff-bad");}
      });
      const allRight=right===a.fields.length;
      const pts=this.hintAdjust(a,Math.round(right/a.fields.length*this.actMax(a)));
      if(allRight){
        [...form.querySelectorAll("input,select,button")].forEach(e=>e.disabled=true);
        showFB(true,"✅ Formular erfolgreich abgeschickt! "+a.explain);
        chk.remove();this.complete(a,pts,true);
      }else{
        showFB(false,`${right} von ${a.fields.length} Feldern richtig. Bitte die rot markierten Felder korrigieren. ${a.explain}`);
        chk.remove();this.complete(a,pts,false);
      }
    };
    foot.appendChild(chk);
  },

  /* ---- scoring helpers ---- */
  scorePts(a,correct){
    let base=correct?(a.boss?20:10):0;
    return this.hintAdjust(a,base);
  },
  hintAdjust(a,base){
    const s=this.state.acts[a.id];
    // hint cost already deducted from global points when used; here we keep awarded >=0
    return Math.max(0,base);
  },

  shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
};

document.addEventListener("DOMContentLoaded",()=>CA.boot());
</script>
