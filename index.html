<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA AV3 – Das große Digital-Abenteuer</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8;
    --teal:#14b8a6; --teal-d:#0d9488; --blue:#3b82f6; --violet:#8b5cf6;
    --amber:#f59e0b; --green:#22c55e; --red:#ef4444; --pink:#ec4899;
    --gold:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);
    color:var(--text);line-height:1.5;-webkit-text-size-adjust:100%}
  h1,h2,h3{margin:0 0 .4em}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:920px;margin:0 auto;padding:0 14px 90px}

  /* ---------- HUD ---------- */
  #hud{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.96);
    backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
  .hud-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;
    flex-wrap:wrap;padding:8px 14px}
  .hud-name{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);
    border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:700;
    font-size:.95rem}
  .chip.pts{color:var(--gold);border-color:#4d3b12;background:#2a230f}
  .chip.rank{color:var(--teal)}
  .hud-spacer{flex:1}
  .hud-bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;
    flex-basis:100%;margin-top:2px}
  .hud-bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--blue));
    transition:width .5s}
  .mini-btn{background:var(--card2);border:1px solid var(--line);color:var(--muted);
    border-radius:8px;padding:4px 9px;font-size:.8rem}
  .mini-btn:hover{color:var(--text)}

  /* ---------- generic ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin:16px 0;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .btn{background:var(--teal);color:#04211d;border:none;border-radius:12px;
    padding:12px 20px;font-size:1.05rem;font-weight:800}
  .btn:hover{background:var(--teal-d)}
  .btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
  .btn.ghost:hover{border-color:var(--teal)}
  .btn.block{display:block;width:100%;margin-top:8px}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:var(--card2);border:1px solid var(--line);
    border-radius:999px;padding:3px 12px;font-size:.8rem;font-weight:700;margin:2px}
  .tag-c{color:var(--violet);border-color:#3b2a52}
  .hidden{display:none!important}

  /* ---------- start ---------- */
  .hero{text-align:center;padding:34px 16px 8px}
  .hero .big{font-size:2.1rem;font-weight:900;
    background:linear-gradient(90deg,var(--teal),var(--blue),var(--violet));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .save-banner{background:#3a2a09;border:2px solid var(--amber);color:#fde68a;
    border-radius:14px;padding:14px 16px;margin:16px 0;font-size:.98rem}
  .save-banner b{color:#fff}
  input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
    background:var(--card2);color:var(--text);font-size:1.1rem}
  input[type=text]:focus{outline:none;border-color:var(--teal)}
  .save-state{font-size:.85rem;margin-top:8px}
  .ok{color:var(--green)} .bad{color:var(--red)}

  /* ---------- worldmap ---------- */
  .worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .world-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
  .world-card:hover{transform:translateY(-3px);border-color:var(--teal)}
  .world-card .wc-emoji{font-size:2.3rem}
  .world-card h3{margin:6px 0 2px;font-size:1.15rem}
  .world-card .wc-bpe{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .stars{font-size:1.1rem;margin-top:8px;letter-spacing:2px}
  .wc-prog{height:6px;background:var(--card2);border-radius:999px;margin-top:10px;overflow:hidden}
  .wc-prog>span{display:block;height:100%;background:var(--teal)}
  .wc-lock{position:absolute;inset:0;background:rgba(15,23,42,.72);display:flex;
    align-items:center;justify-content:center;font-size:1.6rem;flex-direction:column;gap:4px}
  .wc-badge{position:absolute;top:8px;right:10px;font-size:1.3rem}

  /* ---------- activity ---------- */
  .act{border-left:5px solid var(--line)}
  .act.done{border-left-color:var(--green)}
  .act .a-type{font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    font-weight:800}
  .act .q{font-size:1.12rem;font-weight:700;margin:6px 0 12px}
  .opt{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);
    color:var(--text);border-radius:12px;padding:12px 14px;margin:7px 0;font-size:1rem}
  .opt:hover{border-color:var(--teal)}
  .opt.sel{border-color:var(--blue)}
  .opt.correct{border-color:var(--green);background:#0e2e1c}
  .opt.wrong{border-color:var(--red);background:#2e1414}
  .opt.disabled{opacity:.85;cursor:default}
  .fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.97rem;display:none}
  .fb.show{display:block}
  .fb.good{background:#0e2e1c;border:1px solid var(--green)}
  .fb.bad{background:#2e1414;border:1px solid var(--red)}
  .a-foot{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .hintbtn{background:#2a230f;border:1px solid var(--amber);color:var(--gold);border-radius:10px;
    padding:8px 12px;font-weight:700;font-size:.85rem}
  .hintbtn:disabled{opacity:.5;cursor:default}
  .hintbox{background:#2a230f;border:1px dashed var(--amber);color:#fde68a;border-radius:10px;
    padding:10px 12px;margin-top:8px;font-size:.92rem;display:none}
  .hintbox.show{display:block}
  .checkbtn{background:var(--blue);color:#03152e;border:none;border-radius:10px;padding:10px 16px;
    font-weight:800}
  .checkbtn:hover{filter:brightness(1.1)}
  .a-pts{margin-left:auto;font-weight:800;color:var(--gold);font-size:.9rem}

  /* match / connect */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .m-col{display:flex;flex-direction:column;gap:8px}
  .m-item{background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:11px 12px;
    text-align:center;font-weight:600}
  .m-item:hover{border-color:var(--teal)}
  .m-item.picked{border-color:var(--blue);background:#12233f}
  .m-item.linked{border-color:var(--green);background:#0e2e1c;cursor:default}
  .m-item.badlink{border-color:var(--red);background:#2e1414}
  .m-item .lbl{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:var(--teal);
    color:#04211d;font-size:.75rem;font-weight:800;line-height:20px;margin-left:6px}

  /* order */
  .order-list{display:flex;flex-direction:column;gap:8px}
  .o-item{display:flex;align-items:center;gap:10px;background:var(--card2);border:2px solid var(--line);
    border-radius:10px;padding:10px 12px}
  .o-item.correct{border-color:var(--green)}
  .o-item.wrong{border-color:var(--red)}
  .o-num{width:26px;height:26px;border-radius:8px;background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}
  .o-move{margin-left:auto;display:flex;gap:4px}
  .o-move button{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font-weight:800}
  .o-move button:hover{border-color:var(--teal)}

  /* buckets */
  .bucket-items{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
  .b-item{background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600}
  .b-item.picked{border-color:var(--blue);background:#12233f}
  .b-item.placed{opacity:.45}
  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .bucket{background:var(--card2);border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:90px}
  .bucket h4{margin:0 0 6px;text-align:center;font-size:.95rem}
  .bucket.over{border-color:var(--teal)}
  .drop-chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;
    margin:4px;display:inline-block;font-size:.9rem}
  .drop-chip.correct{border-color:var(--green);background:#0e2e1c}
  .drop-chip.wrong{border-color:var(--red);background:#2e1414}

  /* cloze / short */
  .cloze{font-size:1.08rem;line-height:2.1}
  .cloze select{background:var(--card2);color:var(--text);border:2px solid var(--blue);border-radius:8px;
    padding:5px 8px;font-size:1rem;margin:0 3px}
  .cloze select.correct{border-color:var(--green)} .cloze select.wrong{border-color:var(--red)}
  textarea{width:100%;min-height:80px;background:var(--card2);color:var(--text);border:2px solid var(--line);
    border-radius:12px;padding:11px 13px;font-size:1rem;font-family:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--teal)}

  /* tf set */
  .tf-row{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin:7px 0}
  .tf-row .st{flex:1}
  .tf-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;
    padding:7px 12px;font-weight:800;font-size:.85rem}
  .tf-btn.sel{border-color:var(--blue);background:#12233f}
  .tf-btn.correct{border-color:var(--green);background:#0e2e1c}
  .tf-btn.wrong{border-color:var(--red);background:#2e1414}

  /* memory */
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  @media(max-width:520px){.mem-grid{grid-template-columns:repeat(3,1fr)}.match-grid{gap:6px}}
  .mem-card{aspect-ratio:1/1;background:var(--card2);border:2px solid var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:700;
    font-size:.82rem;user-select:none}
  .mem-card .front{color:var(--muted);font-size:1.5rem}
  .mem-card.flip{border-color:var(--blue);background:#12233f}
  .mem-card.matched{border-color:var(--green);background:#0e2e1c;cursor:default}

  /* password */
  .pw-meter{height:12px;background:var(--card2);border-radius:999px;overflow:hidden;margin:10px 0}
  .pw-meter>span{display:block;height:100%;width:0;transition:width .3s,background .3s}
  .pw-checks{list-style:none;padding:0;margin:8px 0;font-size:.92rem}
  .pw-checks li{padding:2px 0}
  .pw-checks li::before{content:"⚪ ";}
  .pw-checks li.ok::before{content:"✅ ";}

  /* sim */
  .sim-scene{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;
    font-size:1.03rem;margin-bottom:10px}
  .sim-choice{display:block;width:100%;text-align:left;background:var(--card2);border:2px solid var(--line);
    color:var(--text);border-radius:12px;padding:12px 14px;margin:7px 0;font-size:1rem}
  .sim-choice:hover{border-color:var(--teal)}

  /* fakespot */
  .fake-web{background:#f8fafc;color:#0f172a;border-radius:12px;overflow:hidden;border:1px solid #cbd5e1}
  .fake-bar{background:#e2e8f0;padding:8px 12px;font-size:.85rem;font-family:monospace}
  .fake-body{padding:14px}
  .fake-el{border:2px solid transparent;border-radius:8px;padding:6px 8px;margin:6px 0;cursor:pointer}
  .fake-el:hover{background:#fef9c3}
  .fake-el.picked{border-color:#2563eb;background:#dbeafe}
  .fake-el.hit{border-color:#16a34a;background:#dcfce7}
  .fake-el.miss{border-color:#dc2626;background:#fee2e2}

  /* toast + badges */
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);
    background:var(--card);border:2px solid var(--teal);border-radius:14px;padding:12px 20px;
    font-weight:800;z-index:100;transition:transform .35s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90%}
  #toast.show{transform:translateX(-50%) translateY(0)}
  .badge-wall{display:flex;flex-wrap:wrap;gap:10px}
  .badge{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
    text-align:center;width:120px}
  .badge.locked{opacity:.35}
  .badge .b-ic{font-size:1.8rem}
  .badge .b-nm{font-size:.78rem;font-weight:700;margin-top:4px}

  /* report */
  table.rep{width:100%;border-collapse:collapse;font-size:.95rem}
  table.rep th,table.rep td{border:1px solid var(--line);padding:9px 10px;text-align:left}
  table.rep th{background:var(--card2)}
  .cert{background:linear-gradient(135deg,#0d9488,#1e40af);border-radius:18px;padding:26px;text-align:center;
    border:3px solid var(--gold)}
  .cert .ct{font-size:1.5rem;font-weight:900}

  .navrow{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
  footer{color:var(--muted);font-size:.8rem;text-align:center;padding:20px 10px 40px}

  /* ---------- settings / accessibility ---------- */
  body.big{font-size:1.16rem}
  body.big .btn{font-size:1.15rem}
  body.calm .world-card:hover{transform:none}
  .spk{background:var(--card2);border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:8px 11px;font-weight:700;font-size:.85rem}
  .spk:hover{color:var(--text);border-color:var(--teal)}
  .spk.on{color:var(--teal);border-color:var(--teal);background:#0d2b28}
  .mini-btn.on{color:var(--teal);border-color:var(--teal)}
  .retrybtn{background:#241a38;border:1px solid var(--violet);color:#d8b4fe;border-radius:10px;
    padding:8px 12px;font-weight:700;font-size:.85rem}
  .retrybtn:hover{filter:brightness(1.18)}
  .abbr{border-bottom:1px dotted var(--teal);cursor:help}

  /* ---------- celebrate / confetti ---------- */
  #celebrate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
    pointer-events:none;opacity:0;transition:opacity .3s}
  #celebrate.show{opacity:1}
  #celebrate .cbox{background:var(--card);border:3px solid var(--gold);border-radius:20px;
    padding:24px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55);transform:scale(.85);
    transition:transform .3s}
  #celebrate.show .cbox{transform:scale(1)}
  #celebrate .cbig{font-size:1.5rem;font-weight:900;color:var(--gold);margin-top:4px}
  .confetti{position:fixed;top:-14px;width:9px;height:15px;z-index:199;pointer-events:none;border-radius:2px;
    animation:cfall linear forwards}
  @keyframes cfall{to{transform:translateY(112vh) rotate(560deg);opacity:.15}}

  /* ---------- livecell (Mini-Excel) ---------- */
  .xl-tab{border-collapse:collapse;margin:4px 0 12px;font-size:1rem}
  .xl-tab th,.xl-tab td{border:1px solid var(--line);padding:8px 12px;text-align:center;min-width:64px}
  .xl-tab th{background:var(--card2);color:var(--muted);font-weight:700}
  .xl-corner,.xl-rownum{background:var(--card);color:var(--muted);min-width:26px;width:26px}
  .xl-cell{background:var(--card);color:var(--text)}
  .xl-target{background:#4d3b12;color:#fff;font-weight:800;border:2px solid var(--gold)}
  .xl-q{color:var(--gold)}
  .xl-err{color:var(--red);font-weight:800;font-size:.85rem}
  .xl-input-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
  .xl-lbl{font-weight:700;color:var(--muted)}
  .xl-formula{flex:1;min-width:200px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);
    background:var(--card2);color:var(--text);font-size:1rem;font-family:"Consolas",monospace}
  .xl-formula:focus{outline:none;border-color:var(--teal)}
  .xl-formula:disabled{opacity:.7}
  .xl-result{margin-top:8px;font-size:.92rem}
  .xl-result.bad{color:var(--red)}

  /* ---------- inbox (Postfach) ---------- */
  .mail-row{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
  .mail-from{font-weight:800}
  .mail-subj{font-weight:700;margin:2px 0}
  .mail-prev{color:var(--muted);font-size:.88rem;margin-bottom:8px}
  .mail-btns{display:flex;gap:6px;flex-wrap:wrap}
  .mail-act{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;
    padding:8px 12px;font-weight:700;font-size:.9rem}
  .mail-act:hover{border-color:var(--teal)}
  .mail-act.sel{border-color:var(--blue);background:#12233f}
  .mail-act.correct{border-color:var(--green);background:#0e2e1c}
  .mail-act.wrong{border-color:var(--red);background:#2e1414}

  /* ---------- formfill (Formular) ---------- */
  .ffform{display:flex;flex-direction:column;gap:12px;margin:4px 0}
  .ff-field{display:flex;flex-direction:column;gap:4px}
  .ff-label{font-weight:700;font-size:.92rem}
  .ff-input{padding:10px 12px;border-radius:10px;border:2px solid var(--line);
    background:var(--card2);color:var(--text);font-size:1rem;font-family:inherit}
  .ff-input:focus{outline:none;border-color:var(--teal)}
  .ff-input.ff-good{border-color:var(--green)}
  .ff-input.ff-bad{border-color:var(--red)}
  .ff-err{color:var(--red);font-size:.85rem;min-height:0}
  .ff-file{position:relative}
  .ff-filebtn{border:2px solid var(--line);background:var(--card2);color:var(--text);border-radius:10px;
    padding:9px 14px;font-weight:700}
  .ff-filebtn:hover{border-color:var(--teal)}
  .ff-file.ff-bad .ff-filebtn{border-color:var(--red)}
  .ff-file.ff-good .ff-filebtn{border-color:var(--green)}
  .ff-filemenu{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .ff-fileopt{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:8px;padding:8px 12px;font-size:.92rem}
  .ff-fileopt:hover{border-color:var(--teal);background:var(--card2)}
  .ff-fileshown{font-size:.85rem;margin-top:4px}
</style>
</head>
<body>

<div id="hud" class="hidden">
  <div class="hud-in">
    <span class="hud-name">👤 <span id="hName">–</span></span>
    <span class="chip pts">⭐ <span id="hPts">0</span> Pkt</span>
    <span class="chip rank">🏅 <span id="hRank">–</span></span>
    <span class="hud-spacer"></span>
    <button class="mini-btn" id="btnRead"  onclick="CA.toggleSet('read')"  title="Fragen vorlesen">🔊 Vorlesen</button>
    <button class="mini-btn" id="btnSound" onclick="CA.toggleSet('sound')" title="Töne an/aus">🔉 Ton</button>
    <button class="mini-btn" id="btnBig"   onclick="CA.toggleSet('big')"   title="Schrift größer">🔎 Schrift</button>
    <button class="mini-btn" onclick="CA.go('map')">🗺️ Karte</button>
    <button class="mini-btn" onclick="CA.go('report')">📊 Bericht</button>
    <button class="mini-btn" onclick="CA.resetAll()">↺ Reset</button>
    <div class="hud-bar"><span id="hBar"></span></div>
  </div>
</div>

<div class="wrap" id="app"></div>

<div id="toast"></div>
<div id="celebrate"><div class="cbox"><div id="celeEmoji" style="font-size:2.6rem">🎉</div><div class="cbig" id="celeText"></div></div></div>

<script>
"use strict";

/* =========================================================
   INHALTE – 6 Welten (BPE 1–6) + Finale
   ========================================================= */
const WORLDS = [
{
  id:"w1", bpe:"BPE 1", emoji:"🔐", color:"#14b8a6",
  title:"Der sichere Arbeitsplatz",
  story:"Willkommen im PC-Raum! Bevor du loslegst, sorgst du dafür, dass dein Gerät sicher läuft, du deine Dateien wiederfindest und dich niemand hacken kann.",
  acts:[
    {id:"w1a1",type:"mc",q:"Du kommst in den PC-Raum. Was ist eine wichtige Regel?",
     options:["Getränke direkt neben die Tastatur stellen","Erst Hände desinfizieren, dann sofort etwas essen","Keine Speisen oder offenen Getränke an den PC","Mit nassen Händen den Bildschirm putzen"],
     answer:2,explain:"Essen und offene Getränke gehören nicht an den PC – Krümel und Flüssigkeit zerstören die Technik.",
     why:["Ausgekippte Getränke können die Tastatur zerstören.","Essen am PC macht Krümel und Fettflecken – das gehört nicht dorthin.","","Nasse Hände und Technik vertragen sich nicht."],

const CA = {
  KEY:"ca_av3_rueckblick_v1",
  state:null,
  storageOK:true,
  _retry:{},          // transiente Merker für „Nochmal versuchen“
  _rankIdx:0,         // zuletzt angezeigter Rang (für Aufstiegs-Feier)

  boot(){
    this.storageOK = this.testStorage();
    this.load();
    this.applySettings();
    this._rankIdx=this.rankIdx();
    if(this.state && this.state.name && this.state.started){
      document.getElementById("hud").classList.remove("hidden");
      this.updateSetBtns();
      this.go("map");
    }else{
      this.renderStart();
    }
  },
  testStorage(){
    try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}
    catch(e){return false;}
  },
  fresh(){return {name:"",started:false,points:0,acts:{},badges:[],streak:0,
    settings:{read:false,sound:true,big:false},startedAt:null};},
  load(){
    if(!this.storageOK){this.state=this.fresh();return;}
    try{
      const parsed = JSON.parse(localStorage.getItem(this.KEY));
      // fehlende Felder aus fresh() ergänzen -> schützt vor kaputten/alten Ständen
      this.state = Object.assign(this.fresh(), parsed || {});
      if(!this.state.acts || typeof this.state.acts!=="object") this.state.acts={};
      if(!Array.isArray(this.state.badges)) this.state.badges=[];
      this.state.settings = Object.assign(this.fresh().settings, this.state.settings||{});
    }
    catch(e){this.state=this.fresh();}
  },
  save(){
    if(!this.storageOK) return;
    try{localStorage.setItem(this.KEY, JSON.stringify(this.state));}catch(e){}
  },

  rank(){let r=RANKS[0];for(const x of RANKS){if(this.state.points>=x.min)r=x;}return r.nm;},
  rankIdx(){let idx=0;RANKS.forEach((x,i)=>{if(this.state.points>=x.min)idx=i;});return idx;},

  /* Spezial-Prüfungen für Kurzantworten (statt reinem Stichwort-Suchen) */
  CHECKS:{
    // Durchschnitt von B1..B4: akzeptiert Bereich B1:B4 oder alle vier Zellen einzeln,
    // auch AVERAGE; lehnt B1;B4 (nur zwei Zellen) korrekt ab.
    avgB1B4(v){
      const s=(v||"").toLowerCase().replace(/\s+/g,"");
      const m=s.match(/^=?(mittelwert|average)\((.+)\)$/);
      if(!m)return false;
      const inside=m[2];
      return /^b1:b4$/.test(inside) || /^b1;b2;b3;b4$/.test(inside);
    }
  },
  maxPoints(){
    let m=0;
    WORLDS.forEach(w=>w.acts.forEach(a=>{m+=this.actMax(a);}));
    return m;
  },
  actMax(a){
    if(a.type==="tfset") return a.statements.length*5;
    return a.boss?20:10;
  },
  updateHUD(){
    document.getElementById("hName").textContent=this.state.name||"–";
    document.getElementById("hPts").textContent=this.state.points;
    document.getElementById("hRank").textContent=this.rank();
    const pct=Math.min(100,Math.round(this.state.points/this.maxPoints()*100));
    document.getElementById("hBar").style.width=pct+"%";
  },

  /* ---- navigation ---- */
  go(where,arg){
    window.scrollTo(0,0);
    if(where==="map")this.renderMap();
    else if(where==="world")this.renderWorld(arg);
    else if(where==="report")this.renderReport();
    else if(where==="leaderboard")this.renderLeaderboard();
    this.updateHUD();
  },

  /* ---- start screen ---- */
  renderStart(){
    const app=document.getElementById("app");
    const warn = this.storageOK
      ? `<div class="save-state ok" id="saveState">💾 Speicherung aktiv – dein Fortschritt wird auf diesem PC gesichert.</div>`
      : `<div class="save-state bad" id="saveState">⚠️ Achtung: Die Speicherung funktioniert hier NICHT. Bitte speichere diese Datei zuerst richtig ab (siehe Anleitung) und öffne sie dann erneut.</div>`;
    app.innerHTML=`
      <div class="hero">
        <div class="big">🎮 Das große Digital-Abenteuer</div>
        <p class="muted">Computeranwendungen · AV3 · Wiederholung des ganzen Jahres</p>
      </div>
      <div class="save-banner">
        <b>⚠️ Wichtig – zuerst speichern!</b><br>
        Diese Seite merkt sich deine Punkte nur, wenn die Datei <b>fest auf dem PC gespeichert</b> ist.
        Öffne sie <b>nicht</b> direkt aus einer E-Mail oder Vorschau. Speichere sie zuerst in deinen Ordner
        und öffne sie <b>immer von dort</b>. Sonst ist dein Fortschritt weg!
      </div>
      <div class="card">
        <h3>Wie heißt du?</h3>
        <p class="muted">Dein Name erscheint oben – so sieht die Lehrkraft am Bildschirm, wessen Punkte das sind.</p>
        <input type="text" id="nameIn" placeholder="Vorname und erster Buchstabe vom Nachnamen, z. B. Max M." maxlength="30">
        ${warn}
        <button class="btn block" onclick="CA.start()">Los geht's! 🚀</button>
      </div>
      <div class="card">
        <h3>So funktioniert's</h3>
        <p>Du reist durch <b>7 Welten</b>. In jeder Welt löst du verschiedene Aufgaben und Spiele und sammelst
        <b>Punkte ⭐</b> und <b>Abzeichen 🏅</b>. Steckst du fest? Nutze eine <b>Hilfekarte 💡</b> –
        die kostet aber ein paar Punkte. Viel Erfolg!</p>
        <p class="muted" style="font-size:.9rem">Gut zu wissen: Oben kannst du dir Aufgaben <b>🔊 vorlesen</b> lassen und die
        <b>🔎 Schrift</b> größer stellen. War eine Antwort falsch? Klicke <b>🔁 Nochmal versuchen</b> und lerne dazu.</p>
      </div>
      <footer>Bildungsplan Computeranwendungen (AVdual/AV, BW) · BPE 1–6</footer>`;
    const inp=document.getElementById("nameIn");
    inp.value=this.state.name||"";
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")this.start();});
  },
  start(){
    const v=document.getElementById("nameIn").value.trim();
    if(!v){document.getElementById("nameIn").focus();this.toast("Bitte gib zuerst deinen Namen ein 🙂");return;}
    this.state.name=v;this.state.started=true;
    if(!this.state.startedAt)this.state.startedAt=new Date().toLocaleString("de-DE");
    if(!this.state.badges.includes("start"))this.state.badges.push("start");
    this.save();
    document.getElementById("hud").classList.remove("hidden");
    this.updateSetBtns();
    this.go("map");
  },

  /* ---- settings / accessibility ---- */
  toggleSet(k){
    this.state.settings[k]=!this.state.settings[k];
    this.save();this.applySettings();this.updateSetBtns();
    if(k==="read"&&!this.state.settings.read)this.stopSpeak();
    if(k==="read"&&this.state.settings.read)this.toast("🔊 Vorlesen an – tippe eine Aufgabe an.");
  },
  applySettings(){
    const s=this.state.settings||{};
    document.body.classList.toggle("big",!!s.big);
  },
  updateSetBtns(){
    const s=this.state.settings||{};
    const set=(id,on)=>{const b=document.getElementById(id);if(b)b.classList.toggle("on",!!on);};
    set("btnRead",s.read);set("btnSound",s.sound);set("btnBig",s.big);
  },

  /* ---- Sprachausgabe (Web Speech API, offline im Browser) ---- */
  speak(text){
    try{
      if(!("speechSynthesis" in window))return;
      window.speechSynthesis.cancel();
      // Emojis/Symbole vor dem Vorlesen entfernen
      let clean=String(text);
      try{clean=clean.replace(/[\u{1F000}-\u{1FAFF}\u{2190}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu,"");}catch(e){}
      const u=new SpeechSynthesisUtterance(clean.replace(/\s+/g," ").trim());
      u.lang="de-DE";u.rate=.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  },
  stopSpeak(){try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}},

  /* ---- kurze Töne ohne Audiodatei (Web Audio) ---- */
  beep(kind){
    if(!this.state.settings||!this.state.settings.sound)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      this._ac=this._ac||new AC();const ac=this._ac;
      const seq = kind==="good"?[[660,0],[880,.09]] : kind==="win"?[[523,0],[659,.1],[784,.2]] : [[300,0]];
      seq.forEach(([f,t])=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type=kind==="bad"?"sawtooth":"sine";o.frequency.value=f;
        o.connect(g);g.connect(ac.destination);
        const s=ac.currentTime+t;
        g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.15,s+.02);
        g.gain.exponentialRampToValueAtTime(.0001,s+.18);
        o.start(s);o.stop(s+.2);
      });
    }catch(e){}
  },

  /* ---- Feier-Overlay + Konfetti ---- */
  celebrate(emoji,text){
    const box=document.getElementById("celebrate");
    if(!box)return;
    document.getElementById("celeEmoji").textContent=emoji;
    document.getElementById("celeText").textContent=text;
    box.classList.add("show");
    if(!this.state.settings||this.state.settings.calm!==true)this.confetti();
    clearTimeout(this._ct);this._ct=setTimeout(()=>box.classList.remove("show"),1900);
  },
  confetti(){
    const cols=["#14b8a6","#3b82f6","#8b5cf6","#f59e0b","#22c55e","#ec4899","#fbbf24"];
    for(let i=0;i<28;i++){
      const c=document.createElement("div");c.className="confetti";
      c.style.left=Math.random()*100+"vw";
      c.style.background=cols[i%cols.length];
      c.style.animationDuration=(1.1+Math.random()*1.1)+"s";
      c.style.animationDelay=(Math.random()*.25)+"s";
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),2600);
    }
  },

  /* ---- world map ---- */
  worldDone(w){return w.acts.every(a=>this.state.acts[a.id]&&this.state.acts[a.id].done);},
  worldProgress(w){
    const t=w.acts.length;let d=0;
    w.acts.forEach(a=>{if(this.state.acts[a.id]&&this.state.acts[a.id].done)d++;});
    return {d,t,pct:t?Math.round(d/t*100):0};
  },
  worldStars(w){
    let got=0,max=0;
    w.acts.forEach(a=>{max+=this.actMax(a);const s=this.state.acts[a.id];if(s&&s.done)got+=s.points;});
    if(max===0)return 0;const r=got/max;
    return r>=0.9?3:r>=0.6?2:r>0?1:0;
  },
  unlocked(i){
    if(i===0)return true;
    if(WORLDS[i].final){return WORLDS.slice(0,6).every(w=>this.worldProgress(w).d>0);}
    return true; // Welten frei zugänglich (Finale braucht etwas Fortschritt)
  },
  renderMap(){
    const app=document.getElementById("app");
    let cards="";
    WORLDS.forEach((w,i)=>{
      const p=this.worldProgress(w);
      const stars=this.worldStars(w);
      const starStr="★★★☆☆☆".slice(0,3); // placeholder replaced below
      const st="★".repeat(stars)+"☆".repeat(3-stars);
      const locked=!this.unlocked(i);
      const badge=this.worldDone(w)?`<div class="wc-badge">${w.final?"🏆":"✅"}</div>`:"";
      cards+=`
        <div class="world-card" ${locked?"":`onclick="CA.go('world','${w.id}')"`}
             style="border-top:4px solid ${w.color}">

  /* ---- award ---- */
  complete(a,pts,correct){
    const prev=this.state.acts[a.id];
    const retrying=!!this._retry[a.id];
    if(prev&&prev.done&&!retrying)return;
    if(retrying){                       // alte Punkte zurücknehmen, dann neu bewerten
      this.state.points-=(prev?prev.points:0);
      delete this._retry[a.id];
    }
    this.state.acts[a.id]={done:true,points:pts,correct:correct,
      hint:prev?prev.hint:false, retried:!!(retrying||(prev&&prev.retried)),
      answerText:prev?prev.answerText:undefined};
    this.state.points+=pts;
    // Streak/Kombo: nur bei echtem Erstversuch (kein Retry) zählen
    if(!retrying){
      if(correct===true){
        this.state.streak=(this.state.streak||0)+1;
        // Bonus ab 3er-Serie (3,5,7 …)
        if(this.state.streak>=3 && this.state.streak%2===1){
          this.state.points+=2;
          this.toast("🔥 "+this.state.streak+" richtig in Folge!");
        }
      }else if(correct===false){
        this.state.streak=0;
      }
    }
    this.save();
    this.updateHUD();
    const cardEl=document.querySelector('.act[data-aid="'+(window.CSS&&CSS.escape?CSS.escape(a.id):a.id)+'"]');
    if(cardEl){
      cardEl.classList.add("done");
      // „Nochmal versuchen“ direkt nach dem Antworten anbieten (falls nicht perfekt)
      if(!correct && !this.state.acts[a.id].retried && a.type!=="memory" && !cardEl.querySelector(".retrybtn")){
        const foot=cardEl.querySelector(".a-foot");
        if(foot){const rt=document.createElement("button");rt.className="retrybtn";rt.type="button";
          rt.textContent="🔁 Nochmal versuchen";rt.onclick=()=>this.startRetry(a);foot.appendChild(rt);}
      }
    }
    this.checkBadges();
    this.checkRankUp();
    const w=WORLDS.find(x=>x.acts.includes(a));
    if(w)this.updateWorldSummary(w);
    if(correct)this.beep("good"); else if(pts<=0)this.beep("bad");
    if(pts>0)this.toast(`✅ +${pts} Punkte!`);
    else this.toast(`Weiter geht's – nicht aufgeben! 💪`);
  },
  checkRankUp(){
    const idx=this.rankIdx();
    if(idx>this._rankIdx){this._rankIdx=idx;this.beep("win");
      this.celebrate("🏅","Neuer Rang: "+RANKS[idx].nm+"!");}
    else this._rankIdx=idx;
  },
  /* eine erledigte, noch nicht perfekte Aufgabe zum Üben neu öffnen (einmalig) */
  startRetry(a){
    this.stopSpeak();
    this._retry[a.id]=true;
    const w=WORLDS.find(x=>x.acts.includes(a));
    const idx=w?w.acts.indexOf(a):0;
    const sel='.act[data-aid="'+(window.CSS&&CSS.escape?CSS.escape(a.id):a.id)+'"]';
    const old=document.querySelector(sel);
    if(old){
      const fresh=this.buildActivity(a,idx+1,w?w.color:"#14b8a6");
      old.replaceWith(fresh);
      fresh.scrollIntoView({behavior:"smooth",block:"center"});
      if(this.state.settings&&this.state.settings.read)this.speak(this.readText(a));
    }
    this.toast("🔁 Versuch's nochmal – du schaffst das!");
  },
  spendHint(a,cost){
    const s=this.state.acts[a.id]||{done:false,points:0,correct:false,hint:false};
    if(s.hint)return true;      // already paid
    if(s.done)return true;      // free after done
    s.hint=true;
    this.state.acts[a.id]=s;
    this.state.points=Math.max(0,this.state.points-cost);
    this.save();this.updateHUD();
    this.toast(`💡 Hilfekarte: −${cost} Punkte`);
    return true;
  },
  checkBadges(){
    let changed=false;
    WORLDS.forEach(w=>{
      if(this.worldDone(w)&&!this.state.badges.includes(w.id)){this.state.badges.push(w.id);changed=true;
        this.toast(`🏅 Neues Abzeichen: ${(BADGES.find(b=>b.id===w.id)||{}).nm||""}`);}
    });
    // all done
    const allDone=WORLDS.every(w=>this.worldDone(w));
    if(allDone&&!this.state.badges.includes("perfect")){this.state.badges.push("perfect");changed=true;}
    // no hint used at all AND at least 10 done
    const doneCount=Object.values(this.state.acts).filter(x=>x.done).length;
    const anyHint=Object.values(this.state.acts).some(x=>x.hint);
    if(doneCount>=10&&!anyHint&&!this.state.badges.includes("nohint")){this.state.badges.push("nohint");changed=true;}
    if(changed)this.save();
  },

    if(allDone&&!this.state.certShown){
